<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CruiseLink 郵輪內網通</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface2: #334155;
      --primary: #4fd1c5;
      --primary-dark: #0d9488;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --me-bg: #0d9488;
      --other-bg: #1e293b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-weight: 700; font-size: 16px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; margin-right: 4px; }
    .status-dot.on { background: #22c55e; }
    .sub-status { font-size: 12px; color: var(--muted); }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      background: var(--surface2); display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px; color: var(--primary); flex-shrink: 0; overflow: hidden;
      border: 1.5px solid var(--primary);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar.sm { width: 32px; height: 32px; font-size: 13px; border-width: 1px; }
    .avatar.lg { width: 72px; height: 72px; font-size: 26px; }

    .tabs {
      display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1; text-align: center; padding: 10px 4px; font-size: 13px; font-weight: 600;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .main { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .view { display: none; flex: 1; flex-direction: column; overflow-y: auto; padding: 12px; gap: 10px; }
    .view.active { display: flex; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .card:active { opacity: 0.85; }
    .card-body { flex: 1; min-width: 0; }
    .card-title { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--surface2); color: var(--primary); }

    .chat-header {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .btn-ghost {
      background: none; border: none; color: var(--primary); font-size: 15px; font-weight: 600; cursor: pointer; padding: 6px 8px;
    }
    .messages {
      flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px;
    }
    .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 86%; }
    .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
    .bubble {
      background: var(--other-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 8px 12px; font-size: 14px; line-height: 1.45; word-break: break-word;
    }
    .msg-row.me .bubble { background: var(--me-bg); border-color: var(--me-bg); color: #fff; }
    .msg-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 6px; }
    .msg-row.me .msg-meta { justify-content: flex-end; color: #ccfbf1; }
    .msg-img { max-width: 220px; border-radius: 10px; margin-top: 6px; display: block; }

    .composer {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px max(10px, env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--border);
    }
    .input {
      flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 20px; padding: 10px 14px; font-size: 15px; outline: none;
    }
    .btn {
      background: var(--primary-dark); color: #fff; border: none; border-radius: 12px;
      padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn.secondary { background: var(--surface2); color: var(--text); }
    .btn:disabled { opacity: 0.5; }

    .section-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    label { font-size: 13px; color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="avatar" id="myHeaderAvatar">我</div>
      <div>
        <div class="brand-title">🚢 CruiseLink 內網通</div>
        <div class="sub-status"><span class="status-dot" id="wsDot"></span><span id="wsText">連線中...</span></div>
      </div>
    </div>
    <button class="btn-ghost" onclick="switchTab('profile')">設定頭貼</button>
  </header>

  <div class="tabs" id="mainTabs">
    <div class="tab active" data-tab="rooms" onclick="switchTab('rooms')">💬 聊天與群組</div>
    <div class="tab" data-tab="peers" onclick="switchTab('peers')">👥 線上成員</div>
    <div class="tab" data-tab="profile" onclick="switchTab('profile')">🪪 個人資料</div>
  </div>

  <div class="main">
    <!-- 聊天室列表 -->
    <div class="view active" id="view-rooms">
      <div class="row" style="justify-content: space-between;">
        <span style="font-size:13px;color:var(--muted);">群組與私訊頻道</span>
        <button class="btn secondary" style="padding:6px 12px;font-size:13px;" onclick="promptNewGroup()">+ 建立群組</button>
      </div>
      <div id="roomsList" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>

    <!-- 線上成員 -->
    <div class="view" id="view-peers">
      <div style="font-size:13px;color:var(--muted);">點擊成員即可發起 1 對 1 私訊</div>
      <div id="peersList" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>

    <!-- 個人資料 -->
    <div class="view" id="view-profile">
      <div class="section-box">
        <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div class="avatar lg" id="profileAvatarPreview">我</div>
          <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarFile(event)" />
          <div class="row">
            <button class="btn secondary" onclick="document.getElementById('avatarFileInput').click()">📷 選擇 / 拍攝頭貼</button>
            <button class="btn secondary" onclick="clearAvatar()">移除頭貼</button>
          </div>
        </div>
        <div>
          <label>我的顯示名稱</label>
          <input class="input" id="displayNameInput" style="width:100%;margin-top:6px;border-radius:12px;" placeholder="輸入你的暱稱（如：小明）" />
        </div>
        <button class="btn" onclick="saveProfile()">儲存並同步給大家</button>
        <div id="profileHint" style="font-size:12px;color:var(--primary);text-align:center;"></div>
      </div>
    </div>

    <!-- 單一聊天室視圖 -->
    <div class="view" id="view-chat" style="padding:0;gap:0;">
      <div class="chat-header">
        <button class="btn-ghost" onclick="closeRoom()">← 返回</button>
        <div style="font-weight:700;font-size:15px;flex:1;" id="chatRoomTitle">聊天室</div>
      </div>
      <div class="messages" id="messagesBox"></div>
      <div class="composer">
        <input type="file" id="chatImgInput" accept="image/*" style="display:none" onchange="handleChatImage(event)" />
        <button class="btn secondary" style="padding:9px 11px;" onclick="document.getElementById('chatImgInput').click()">🖼️</button>
        <input class="input" id="msgInput" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter')sendMsg()" />
        <button class="btn" onclick="sendMsg()">傳送</button>
      </div>
    </div>
  </div>
</div>

<script>
const store = window.localStorage;
let userId = store.getItem('cl_uid');
if (!userId) {
  userId = 'ios-' + Math.random().toString(36).slice(2, 10);
  store.setItem('cl_uid', userId);
}
let displayName = store.getItem('cl_name') || 'iPhone 旅伴';
let avatarBase64 = store.getItem('cl_avatar') || '';

let peers = [];
let rooms = [];
let activeRoomId = null;
let ws = null;

function renderAvatar(el, name, b64) {
  if (b64) {
    el.innerHTML = `<img src="data:image/jpeg;base64,${b64}" alt="" />`;
  } else {
    el.textContent = (name || '?').slice(0, 1).toUpperCase();
  }
}

function updateMyAvatarUI() {
  renderAvatar(document.getElementById('myHeaderAvatar'), displayName, avatarBase64);
  renderAvatar(document.getElementById('profileAvatarPreview'), displayName, avatarBase64);
  document.getElementById('displayNameInput').value = displayName;
}

function switchTab(tab) {
  activeRoomId = null;
  document.getElementById('mainTabs').style.display = 'flex';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + tab).classList.add('active');
}

function compressImage(file, maxDim, quality, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      cb(dataUrl.split(',')[1]);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleAvatarFile(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  compressImage(f, 160, 0.78, b64 => {
    avatarBase64 = b64;
    updateMyAvatarUI();
  });
}

function clearAvatar() {
  avatarBase64 = '';
  updateMyAvatarUI();
}

async function saveProfile() {
  const n = document.getElementById('displayNameInput').value.trim();
  if (n) displayName = n;
  store.setItem('cl_name', displayName);
  store.setItem('cl_avatar', avatarBase64);
  updateMyAvatarUI();
  await registerPeer();
  const hint = document.getElementById('profileHint');
  hint.textContent = '✅ 已更新名稱與頭貼！';
  setTimeout(() => hint.textContent = '', 2500);
}

async function registerPeer() {
  await fetch('/api/peers/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ userId, displayName, avatarBase64 })
  });
}

async function loadInitial() {
  await registerPeer();
  const [pRes, rRes] = await Promise.all([
    fetch('/api/peers'),
    fetch('/api/rooms?userId=' + encodeURIComponent(userId))
  ]);
  peers = await pRes.json();
  rooms = await rRes.json();
  renderPeers();
  renderRooms();
}

function renderPeers() {
  const box = document.getElementById('peersList');
  box.innerHTML = '';
  peers.forEach(p => {
    const isMe = p.id === userId;
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => { if (!isMe) startDm(p.id); };
    const av = document.createElement('div');
    av.className = 'avatar';
    renderAvatar(av, p.displayName, p.avatarBase64);
    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <div class="card-title">
        <span>${escapeHtml(p.displayName)}${isMe ? ' (我)' : ''}</span>
        <span class="badge">${p.online ? '🟢 線上' : '⚪ 離線'}</span>
      </div>
      <div class="card-sub">${isMe ? '點擊「個人資料」可修改名稱與頭貼' : '點擊開始 1 對 1 私訊'}</div>
    `;
    card.appendChild(av);
    card.appendChild(body);
    box.appendChild(card);
  });
}

function renderRooms() {
  const box = document.getElementById('roomsList');
  box.innerHTML = '';
  rooms.forEach(r => {
    let title = r.name;
    let peerForDm = null;
    if (r.type === 'dm') {
      const otherId = (r.memberIds || []).find(id => id !== userId);
      peerForDm = peers.find(p => p.id === otherId);
      if (peerForDm) title = '💬 ' + peerForDm.displayName;
    }
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openRoom(r.id, title);
    const av = document.createElement('div');
    av.className = 'avatar';
    if (peerForDm) renderAvatar(av, peerForDm.displayName, peerForDm.avatarBase64);
    else av.textContent = r.id === 'lobby' ? '🚢' : '👥';
    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `
      <div class="card-title">
        <span>${escapeHtml(title)}</span>
        <span class="sub-status">${escapeHtml(r.lastTimestamp || '')}</span>
      </div>
      <div class="card-sub">${escapeHtml(r.lastMessage || '')}</div>
    `;
    card.appendChild(av);
    card.appendChild(body);
    box.appendChild(card);
  });
}

async function promptNewGroup() {
  const name = prompt('請輸入新群組名稱：');
  if (!name || !name.trim()) return;
  const res = await fetch('/api/rooms/group', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ name: '👥 ' + name.trim(), memberIds: [userId] })
  });
  const room = await res.json();
  openRoom(room.id, room.name);
}

async function startDm(targetUserId) {
  const res = await fetch('/api/rooms/dm', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ userId, targetUserId })
  });
  const room = await res.json();
  const target = peers.find(p => p.id === targetUserId);
  openRoom(room.id, '💬 ' + (target ? target.displayName : room.name));
}

async function openRoom(roomId, title) {
  activeRoomId = roomId;
  document.getElementById('mainTabs').style.display = 'none';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-chat').classList.add('active');
  document.getElementById('chatRoomTitle').textContent = title;
  const res = await fetch('/api/rooms/' + encodeURIComponent(roomId) + '/messages');
  const msgs = await res.json();
  const box = document.getElementById('messagesBox');
  box.innerHTML = '';
  msgs.forEach(appendMsg);
  box.scrollTop = box.scrollHeight;
}

function closeRoom() {
  switchTab('rooms');
}

function appendMsg(m) {
  const box = document.getElementById('messagesBox');
  const isMe = m.senderId === userId;
  const row = document.createElement('div');
  row.className = 'msg-row' + (isMe ? ' me' : '');

  const av = document.createElement('div');
  av.className = 'avatar sm';
  renderAvatar(av, m.senderName, m.senderAvatar);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const imgHtml = m.imageBase64 ? `<img class="msg-img" src="data:image/jpeg;base64,${m.imageBase64}" />` : '';
  bubble.innerHTML = `
    <div class="msg-meta"><span>${escapeHtml(m.senderName)}</span><span>${escapeHtml(m.timestamp || '')}</span></div>
    ${m.content ? `<div>${escapeHtml(m.content)}</div>` : ''}
    ${imgHtml}
  `;
  row.appendChild(av);
  row.appendChild(bubble);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim();
  if (!text || !activeRoomId) return;
  inp.value = '';
  await fetch('/api/rooms/' + encodeURIComponent(activeRoomId) + '/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ senderId: userId, senderName: displayName, content: text })
  });
}

function handleChatImage(ev) {
  const f = ev.target.files[0];
  if (!f || !activeRoomId) return;
  compressImage(f, 720, 0.72, async b64 => {
    await fetch('/api/rooms/' + encodeURIComponent(activeRoomId) + '/messages', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ senderId: userId, senderName: displayName, content: '', imageBase64: b64 })
    });
  });
  ev.target.value = '';
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(proto + location.host + '/ws?userId=' + encodeURIComponent(userId));
  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('on');
    document.getElementById('wsText').textContent = '已連線內網主機';
  };
  ws.onmessage = ev => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'peers_updated') {
        peers = msg.data || [];
        renderPeers();
      } else if (msg.type === 'rooms_updated') {
        rooms = (msg.data || []).filter(r => r.type === 'group' || (r.memberIds || []).includes(userId));
        renderRooms();
      } else if (msg.type === 'chat_message') {
        if (msg.data && msg.data.roomId === activeRoomId) {
          appendMsg(msg.data);
        }
      }
    } catch (_) {}
  };
  ws.onclose = () => {
    document.getElementById('wsDot').classList.remove('on');
    document.getElementById('wsText').textContent = '重新連線中...';
    setTimeout(connectWs, 3000);
  };
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

updateMyAvatarUI();
loadInitial().then(connectWs);
</script>
</body>
</html>
